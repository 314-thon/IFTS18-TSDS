<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenditi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="aditi.png">
    
    <style>
        .perspective { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-gray-100 p-8 font-sans">

    <div id="login-screen" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
        <h2 class="text-2xl font-bold mb-4 text-center">Acceso Privado</h2>
        
        <input type="email" id="email" placeholder="Email" class="w-full border p-2 mb-3 rounded">
        <input type="password" id="password" placeholder="Contraseña" class="w-full border p-2 mb-4 rounded">
        
        <p id="login-error" class="text-red-500 text-sm mb-2 hidden">Error al iniciar sesión.</p>
        
        <button id="btn-login" class="w-full bg-blue-600 text-white font-bold py-2 mb-2 rounded hover:bg-blue-700">Entrar con Mail</button>

        <div class="flex items-center justify-between my-4">
            <hr class="w-full border-gray-300">
            <span class="px-2 text-gray-500 text-sm">O</span>
            <hr class="w-full border-gray-300">
        </div>

        <button id="btn-google" class="w-full bg-white border border-gray-300 text-gray-700 font-bold py-2 rounded hover:bg-gray-50 flex items-center justify-center gap-2">
            <img src="google.ico" alt="Logo Google" class="w-5 h-5"> 
            <span>Entrar con Google</span>
        </button>
    </div>

    <div id="app-screen" class="max-w-6xl mx-auto hidden p-4">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Agenda Semanal</h1>
            <button id="btn-logout" class="bg-red-500 text-white px-4 py-2 rounded font-bold hover:bg-red-600">Cerrar Sesión</button>
        </div>
        
        <div class="bg-white p-4 rounded-lg shadow-md mb-6 overflow-x-auto">
            <div id="calendar-grid" class="grid grid-cols-7 gap-1 min-w-[700px]">
                </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold mb-4">Detalle de Próximos Turnos</h2>
            <ul id="lista-turnos-html" class="divide-y divide-gray-200">
                <li class="py-2 text-gray-500">Cargando turnos desde la nube...</li>
            </ul>
        </div>
    </div>

    <div id="modal-turno" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 perspective">
        <div id="modal-inner" class="w-full max-w-md relative preserve-3d">
            
            <div id="modal-front" class="bg-white p-6 rounded-lg shadow-lg backface-hidden w-full">
                <h3 class="text-xl font-bold mb-2">Nuevo Turno</h3>
                <p id="selected-datetime" class="text-blue-600 mb-4 font-bold bg-blue-50 p-2 rounded text-center"></p>

                <div class="space-y-3">
                    <input type="text" id="cli-nombre" placeholder="Nombre del Cliente" class="w-full border p-2 rounded">
                    <input type="text" id="cli-tel" placeholder="Teléfono" class="w-full border p-2 rounded">
                    
                    <select id="tratamiento-select" class="w-full border p-2 rounded bg-gray-50">
                        <option value="Limpieza Facial|15000">Limpieza Facial ($15.000)</option>
                        <option value="Lifting de Pestañas|12000">Lifting de Pestañas ($12.000)</option>
                        <option value="Masaje Descontracturante|18000">Masaje Descontracturante ($18.000)</option>
                    </select>

                    <div class="flex gap-2">
                        <input type="number" id="monto-senia" placeholder="Monto Seña $" class="w-1/2 border p-2 rounded">
                        <select id="metodo-pago" class="w-1/2 border p-2 rounded bg-gray-50">
                            <option value="Transferencia">Transferencia</option>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Mercado Pago">Mercado Pago</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button id="btn-cerrar-modal" class="bg-gray-200 text-gray-700 px-4 py-2 rounded font-bold hover:bg-gray-300">Cancelar</button>
                    <button id="btn-guardar-turno" class="bg-green-600 text-white px-4 py-2 rounded font-bold hover:bg-green-700">Añadir Turno</button>
                </div>
            </div>

            <div id="modal-back" class="bg-white p-6 rounded-lg shadow-lg backface-hidden w-full absolute inset-0 flex flex-col items-center justify-center rotate-y-180">
                <div class="text-6xl mb-4 animate-bounce">✨</div>
                <h3 class="text-3xl font-bold text-green-600 mb-2">¡Confirmado!</h3>
                <p class="text-gray-600 font-medium">El turno se guardó en la agenda.</p>
            </div>
        </div>
    </div>

    <script type="module">
        // 1. IMPORTACIONES
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 2. CONFIGURACIÓN
        const firebaseConfig = {
            apiKey: "AIzaSyCxbTt6Y5f931NqQHClkgwS2EBMNLsxmKM",
            authDomain: "agenditi-d0aa0.firebaseapp.com",
            projectId: "agenditi-d0aa0",
            storageBucket: "agenditi-d0aa0.firebasestorage.app",
            messagingSenderId: "1096149766612",
            appId: "1:1096149766612:web:2a70d018991192f2a08641"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 3. VARIABLES GLOBALES
        let turnosGlobales = [];
        let fechaSeleccionada = "";
        let horaSeleccionada = "";
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');

        // 4. CLASES POO
        class Cliente {
            constructor(nombre, telefono) {
                this.nombre = nombre;
                this.telefono = telefono;
            }
        }
        class Tratamiento {
            constructor(nombre, precioBase) {
                this.nombre = nombre;
                this.precioBase = precioBase;
            }
        }
        class Pago {
            constructor(monto, metodoPago, tipo) {
                this.monto = monto;
                this.metodoPago = metodoPago; 
                this.tipo = tipo;
            }
        }
        class Turno {
            constructor(cliente, tratamiento, fecha, hora, pagoInicial) {
                this.cliente = cliente;
                this.tratamiento = tratamiento;
                this.fecha = fecha;
                this.hora = hora;
                this.pagos = [pagoInicial];
            }
            toPlainObject() {
                return {
                    cliente: { nombre: this.cliente.nombre, telefono: this.cliente.telefono },
                    tratamiento: { nombre: this.tratamiento.nombre, precioBase: this.tratamiento.precioBase },
                    fecha: this.fecha,
                    hora: this.hora,
                    pagos: this.pagos.map(p => ({ monto: p.monto, metodo: p.metodoPago, tipo: p.tipo })),
                    creadoEn: new Date()
                };
            }
        }

        // 5. FUNCIONES PRINCIPALES
        function renderizarCalendario() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = ''; 

            const horas = ["10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30"];
            
            let diasVisibles = [];
            let fechaIterador = new Date();
            while(diasVisibles.length < 6) {
                if(fechaIterador.getDay() !== 0) { 
                    diasVisibles.push({
                        iso: fechaIterador.toISOString().split('T')[0],
                        texto: fechaIterador.toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'numeric' })
                    });
                }
                fechaIterador.setDate(fechaIterador.getDate() + 1);
            }

            grid.appendChild(document.createElement('div')); 
            diasVisibles.forEach(dia => {
                let div = document.createElement('div');
                div.className = "text-center font-bold text-sm bg-blue-800 text-white py-2 rounded capitalize";
                div.innerText = dia.texto;
                grid.appendChild(div);
            });

            horas.forEach(hora => {
                let divHora = document.createElement('div');
                divHora.className = "text-right pr-2 text-sm text-gray-600 font-bold self-center";
                divHora.innerText = hora;
                grid.appendChild(divHora);

                diasVisibles.forEach(dia => {
                    let ocupados = turnosGlobales.filter(t => t.fecha === dia.iso && t.hora === hora).length;
                    let slot = document.createElement('div');
                    slot.className = "border rounded p-1 text-center text-xs font-bold transition-all h-10 flex flex-col items-center justify-center ";

                    if (ocupados === 0) {
                        slot.classList.add('bg-green-100', 'text-green-800', 'border-green-300', 'cursor-pointer', 'hover:bg-green-200');
                        slot.innerText = "Libre";
                        slot.onclick = () => abrirModal(dia.iso, hora);
                    } else if (ocupados === 1) {
                        slot.classList.add('bg-yellow-100', 'text-yellow-800', 'border-yellow-300', 'cursor-pointer', 'hover:bg-yellow-200');
                        slot.innerText = "Parcial (1/2)";
                        slot.onclick = () => abrirModal(dia.iso, hora);
                    } else {
                        slot.classList.add('bg-red-100', 'text-red-800', 'border-red-300', 'cursor-not-allowed', 'opacity-70');
                        slot.innerText = "Lleno (2/2)";
                    }
                    grid.appendChild(slot);
                });
            });
        }

        window.abrirWhatsApp = function(telefono, nombre, fecha, hora) {
            const horaActual = new Date().getHours();
            let saludo = "¡Buenas noches!";
            if (horaActual >= 6 && horaActual < 13) saludo = "¡Buenos días!";
            else if (horaActual >= 13 && horaActual < 20) saludo = "¡Buenas tardes!";

            const textoBase = encodeURIComponent(`${saludo} ${nombre} `);
            const emojiMano = "%F0%9F%91%8B";
            const textoMedio = encodeURIComponent(`\n\nTu turno fue confirmado para el día *${fecha}* a las *${hora} hs* `);
            const emojiReloj = "%E2%8F%B0";
            const textoFin = encodeURIComponent(`.\n\n¡Te esperamos! `);
            const emojisAditi = "%E2%9C%A8%F0%9F%92%85%0AAditi Est%C3%A9tica %F0%9F%8C%B8"; 

            const mensajeFinal = textoBase + emojiMano + textoMedio + emojiReloj + textoFin + emojisAditi;
            
            let telLimpio = telefono.replace(/\D/g, ''); 
            if (telLimpio.length === 10) telLimpio = "549" + telLimpio; 

            window.open(`https://api.whatsapp.com/send?phone=${telLimpio}&text=${mensajeFinal}`, '_blank');
        };

        window.borrarTurno = async function(id) {
            if (confirm("🚨 ¿Estás seguro de que querés borrar este turno? Esta acción es definitiva.")) {
                try {
                    await deleteDoc(doc(db, "turnos", id));
                } catch (error) {
                    console.error("Error al borrar turno:", error);
                }
            }
        };

        function cargarTurnosEnTiempoReal() {
            const q = query(collection(db, "turnos")); 
            onSnapshot(q, (querySnapshot) => {
                turnosGlobales = [];
        
                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    data.id = documento.id;
                    turnosGlobales.push(data);
                });

                // Orden cronológico
                turnosGlobales.sort((a, b) => {
                    const fechaA = new Date(`${a.fecha}T${a.hora}`);
                    const fechaB = new Date(`${b.fecha}T${b.hora}`);
                    return fechaA - fechaB;
                });

                const listaUI = document.getElementById('lista-turnos-html');
                listaUI.innerHTML = ""; 
        
                turnosGlobales.forEach((data) => {
                    const li = document.createElement("li");
                    li.className = "py-3 flex justify-between items-center border-b last:border-0";
                    
                    // Lógica segura de dinero (por si hay datos viejos en la base)
                    const senia = data.pagos && data.pagos.length > 0 ? data.pagos[0].monto : 0;
                    const precioTotal = data.tratamiento ? data.tratamiento.precioBase : 0;
                    const saldoPendiente = precioTotal - senia;

                    li.innerHTML = `
                        <div class="flex-1 flex items-center gap-3">
                            <div>
                                <p class="font-bold">${data.cliente.nombre} <span class="text-sm font-normal text-gray-500">(${data.tratamiento.nombre})</span></p>
                                <p class="text-sm text-gray-600">Día: ${data.fecha} a las ${data.hora}</p>
                            </div>
                            <button onclick="window.borrarTurno('${data.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs px-2 py-1 rounded transition-colors border border-red-200" title="Borrar Turno">
                                🗑️
                            </button>
                        </div>
                        <div class="text-right flex items-center gap-3">
                            <div class="flex flex-col items-end gap-1">
                                <span class="inline-block bg-blue-100 text-blue-800 text-[11px] px-2 rounded-full font-bold">Seña: $${senia}</span>
                                <span class="inline-block bg-orange-100 text-orange-800 text-[11px] px-2 rounded-full font-bold">Resta: $${saldoPendiente}</span>
                            </div>
                            <button onclick="window.abrirWhatsApp('${data.cliente.telefono}', '${data.cliente.nombre}', '${data.fecha}', '${data.hora}')" class="bg-green-500 hover:bg-green-600 text-white text-xs px-3 py-2 flex items-center gap-1 rounded transition-colors" title="Confirmar por WhatsApp">
                                <img src="whatsapp.ico" alt="WA" class="w-4 h-4"> Confirmar
                            </button>
                        </div>
                    `;
                    listaUI.appendChild(li);
                });
        
                renderizarCalendario(); 
            });
        }

        function abrirModal(fecha, hora) {
            fechaSeleccionada = fecha;
            horaSeleccionada = hora;
            document.getElementById('selected-datetime').innerText = `🗓️ ${fecha} a las ⏰ ${hora} hs`;
            document.getElementById('modal-turno').classList.remove('hidden');
        }

        // 6. EVENTOS Y ESCUCHADORES
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                cargarTurnosEnTiempoReal(); 
            } else {
                loginScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        document.getElementById('cli-tel').addEventListener('input', function(e) {
            let numero = e.target.value.replace(/\D/g, ''); 
            if (numero.startsWith('549')) numero = numero.substring(3);
            else if (numero.startsWith('54')) numero = numero.substring(2);
            if (numero.length > 10) numero = numero.substring(numero.length - 10);
            e.target.value = numero;
        });

        document.getElementById('btn-google').addEventListener('click', (e) => {
            e.preventDefault();
            signInWithPopup(auth, provider).catch((error) => console.error("Error con Google:", error));
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            document.getElementById('login-error').classList.add('hidden');
            
            signInWithEmailAndPassword(auth, email, pass).catch((error) => {
                document.getElementById('login-error').classList.remove('hidden');
                console.error("Error de login:", error);
            });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth);
        });

        document.getElementById('btn-cerrar-modal').addEventListener('click', () => {
            document.getElementById('modal-turno').classList.add('hidden');
        });

        document.getElementById('btn-guardar-turno').addEventListener('click', async () => {
            const nombre = document.getElementById('cli-nombre').value;
            const tel = document.getElementById('cli-tel').value;
            const montoSenia = parseFloat(document.getElementById('monto-senia').value);
            
            if(!nombre || !montoSenia) {
                alert("Por favor completá el nombre y el monto de la seña.");
                return;
            }

            const tratData = document.getElementById('tratamiento-select').value.split('|');
            const nuevoCliente = new Cliente(nombre, tel);
            const nuevoTratamiento = new Tratamiento(tratData[0], parseFloat(tratData[1]));
            const nuevaSenia = new Pago(montoSenia, document.getElementById('metodo-pago').value, "Seña");
            
            const nuevoTurno = new Turno(nuevoCliente, nuevoTratamiento, fechaSeleccionada, horaSeleccionada, nuevaSenia);

            try {
                await addDoc(collection(db, "turnos"), nuevoTurno.toPlainObject());
                
                // Animación Flashcard 3D
                document.getElementById('modal-inner').classList.add('rotate-y-180');
                
                setTimeout(() => {
                    document.getElementById('modal-turno').classList.add('hidden');
                    document.getElementById('modal-inner').classList.remove('rotate-y-180');
                    
                    document.getElementById('cli-nombre').value = '';
                    document.getElementById('cli-tel').value = '';
                    document.getElementById('monto-senia').value = '';
                }, 2000);
                
            } catch (e) {
                console.error("Error guardando turno: ", e);
            }
        });
    </script>
</body>
</html>
